name: import-site
on:
  push:
    paths:
      - .github/workflows/import.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download built page
        run: |
          curl -fsSL -o index.html 'https://sg.migoo.ai/beeai/api/v1/media/signed/budee/2026/11/11/52f85e60.html?expires=1794393054&sig=21149a71d4dc5d2005305dd2c9111357b48f0e4f31fe5fec0b8e9ad857fdb159'
          echo 'ea602c2f3e39bd340719dfdb02d5dd380151fd603fccc072376134f6af41b216  index.html' | sha256sum -c -
          git rm -q .github/workflows/import.yml
      - name: Commit
        run: |
          git config user.name 'hhoshizora-usagi'
          git config user.email '333192191+hhoshizora-usagi@users.noreply.github.com'
          git add index.html
          git commit -m 'EPIC DAY.3 splash animation version'
          git push
